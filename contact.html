<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Contatta lo staff</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <h1>📬 Contatta lo staff</h1>

  <form action="/contact" method="POST">
    <input type="text" name="name" placeholder="Il tuo nome" required><br><br>
    <input type="email" name="email" placeholder="La tua email" required><br><br>
    <textarea name="message" rows="6" placeholder="Scrivi il tuo messaggio qui..." required></textarea><br><br>
    <button type="submit">Invia</button>
  </form>

  <br><br>
  <a href="/">← Torna alla home</a>
</body>
</html>
